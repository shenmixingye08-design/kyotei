# 事前登録: V16（株式ポートフォリオのリバランス・フロー）。評価前にコミット。研究プログラム フェーズ 2 の 3 本目
# （V15「金利系の合成」は、部品のキャリー / 金利モメンタム / 長短金利差が V7・V13・V14 ですべて単独マイナスと判明したため、
#   登録前に見送った。負けた部品の組み合わせを試しても試行数が増えるだけのため。V15 のコードは残すが評価しない）
plan_version: fx_plan_v16
registered_at: "2026-09-26"
purpose: >
  Hau & Rey (2006, RFS)「Exchange Rates, Equity Prices, and Capital Flows」/ Camanho, Hau & Rey (2022)
  「Global Portfolio Rebalancing and Exchange Rates」: 自国株が他国より上がると、投資家は配分を戻すため
  上がった国の資産と通貨を売る → 株価の相対的な上昇は、その通貨の将来の下落を予測する。
  8 通貨の株価指数（OECD 月次、FRED）の過去 3 か月上昇率（1 か月ラグ）を横断ランキングし、株が相対的に下がった国の通貨を買う。
  比較: キャリーと等ウェイトで合成した版。枠組みは V7/V13/V14 と同じ（10 ペア・月次・逆ボラ）。
contamination: >
  期間・コスト・ゲートは既出。株価の情報はこれまで一度も使っていない（新しい情報源）。
  3 か月・1 か月ラグは登録時に固定、パラメータは閾値 2 通りのみ。ユーロ圏の集計系列が無い場合はドイツで代用（登録時に固定）。
  DSR は V1 からの累積試行数で補正。最終判断は LOCK 後の PAPER Forward。
swap_source: market
dsr_trials: cumulative
requires_fred: [EQ_USD, EQ_EUR, EQ_JPY, EQ_GBP, EQ_AUD, EQ_NZD, EQ_CAD, EQ_CHF]

unit: portfolio
pairs: [USDJPY, EURUSD, EURJPY, GBPUSD, AUDUSD, AUDJPY, GBPJPY, NZDUSD, USDCAD, USDCHF]
cost_profile: retail_jp
stress_profile: stress_2x
walk_forward:
  scheme: expanding
  first_test_year: 2014
  last_test_year: 2026
  min_train_trades: 20
  selection_metric: sharpe
  subperiods:
    A_2014_2021: [2014, 2021]
    B_2022_2026: [2022, 2026]
final_params: expanding_all

candidates:
  v16_equity_rebal:
    family: equity_rebalancing
    grid: {threshold: [0.5, 1.0]}
  v16_equity_rebal_carry:
    family: equity_rebalancing
    grid: {threshold: [0.5, 1.0]}

risk_overrides:              # V7 と同一
  max_open_positions: 6
  max_currency_exposure: 2.0
  vol_target_annual: 0.03
  fixed_notional_leverage: 1.0

reference_v1: []

gates:                       # V5/V7/V9〜V11 と同一。緩めない
  wf_min_trades: 100
  wf_min_profit_factor: 1.10
  wf_min_sharpe: 0.40
  wf_min_positive_year_ratio: 0.60
  wf_max_single_year_share: 0.40
  wf_max_drawdown: 0.25
  both_subperiods_positive: true
  stress_min_profit_factor: 1.00
  min_positive_pairs: 7
  max_regime_profit_share: 0.70
  deflated_sharpe_min: 0.50
  ml_must_beat_best_simple: true
  min_pnl_ex_top5: 0.0
  max_top1_share: 0.30
