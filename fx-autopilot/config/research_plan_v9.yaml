# 事前登録: V9（複数期間のトレンドフォロー）。評価前にコミット。結果を見て変更しない。research_program.yaml の 2 本目
plan_version: fx_plan_v9
registered_at: "2026-09-26"
purpose: >
  Hurst, Ooi & Pedersen (2017)「A Century of Evidence on Trend-Following Investing」/ Moskowitz, Ooi & Pedersen (2012)
  の時系列モメンタム: 1・3・12 か月のリターンの符号を等しく平均し、その向きに保有する。単一期間より滑らかとされる。
  キャリーは使わない（トレンドだけで 10 ペアに分散）。毎日判断、逆ボラ（vol_target）サイズ、同時 6 本まで。
contamination: >
  期間・コスト・ゲートは既出。V2 で単一期間の週次 TSMOM（5 ペア）は不合格。V5 で 10 ペアの追加 3 ペアは弱かったが、
  ペアを結果で選ばないため 10 ペアすべてを使う。規則は論文どおり（1/3/12 か月・等ウェイト）で、調整は「全期間一致のみ / 多数決」の 2 通り。
  DSR は V1 からの累積試行数で補正。最終判断は LOCK 後の PAPER Forward。
swap_source: market
dsr_trials: cumulative

unit: portfolio
pairs: [USDJPY, EURUSD, EURJPY, GBPUSD, AUDUSD, AUDJPY, GBPJPY, NZDUSD, USDCAD, USDCHF]
cost_profile: retail_jp
stress_profile: stress_2x
walk_forward:
  scheme: expanding
  first_test_year: 2014
  last_test_year: 2026
  min_train_trades: 20
  selection_metric: sharpe
  subperiods:
    A_2014_2021: [2014, 2021]
    B_2022_2026: [2022, 2026]
final_params: expanding_all

candidates:
  v9_tsmom_multi:
    family: trend_multi
    grid: {agree: [all, majority]}

risk_overrides:
  max_open_positions: 6
  max_currency_exposure: 2.0
  vol_target_annual: 0.03
  fixed_notional_leverage: 1.0

reference_v1: []

gates:                      # V5/V7（10 ペア）と同一
  wf_min_trades: 100
  wf_min_profit_factor: 1.10
  wf_min_sharpe: 0.40
  wf_min_positive_year_ratio: 0.60
  wf_max_single_year_share: 0.40
  wf_max_drawdown: 0.25
  both_subperiods_positive: true
  stress_min_profit_factor: 1.00
  min_positive_pairs: 7
  max_regime_profit_share: 0.70
  deflated_sharpe_min: 0.50
  ml_must_beat_best_simple: true
  min_pnl_ex_top5: 0.0
  max_top1_share: 0.30
