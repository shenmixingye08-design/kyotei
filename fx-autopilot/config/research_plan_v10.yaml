# 事前登録: V10（キャリー × 暴落リスク・フィルター）。評価前にコミット。結果を見て変更しない。research_program.yaml の 3 本目
plan_version: fx_plan_v10
registered_at: "2026-09-26"
purpose: >
  キャリー取引は平時に金利差を稼ぎ、世界的にリスク回避が強まると急落する（Brunnermeier, Nagel & Pedersen 2008
  「Carry Trades and Currency Crashes」、Menkhoff, Sarno, Schmeling & Schrimpf 2012「Carry Trades and Global FX Volatility」）。
  そこで、金利差の向き（市場金利、|差| > 0.5%）に保有するのを、VIX が落ち着いているときに限る。
  VIX は前日終値（FRED VIXCLS、1 営業日ラグ）。落ち着き = 過去 252 営業日の中央値以下（below_median）または 80 パーセンタイル以下（below_p80）。
  毎日判断（リスクが高まったら翌日に手仕舞い）、逆ボラ（vol_target）サイズ、同時 6 本まで、10 ペア。
contamination: >
  期間・コスト・ゲートは既出。V3 のキャリーのみ（フィルターなし、7 ペア）は 28 トレード・前半マイナスで不合格。
  フィルターの考え方は論文由来で、閾値は中央値 / 80 パーセンタイルの 2 通りだけ。ペアは結果で選ばず 10 ペアすべて。
  DSR は V1 からの累積試行数で補正。最終判断は LOCK 後の PAPER Forward。
swap_source: market
dsr_trials: cumulative
requires_fred: [VIXCLS]

unit: portfolio
pairs: [USDJPY, EURUSD, EURJPY, GBPUSD, AUDUSD, AUDJPY, GBPJPY, NZDUSD, USDCAD, USDCHF]
cost_profile: retail_jp
stress_profile: stress_2x
walk_forward:
  scheme: expanding
  first_test_year: 2014
  last_test_year: 2026
  min_train_trades: 20
  selection_metric: sharpe
  subperiods:
    A_2014_2021: [2014, 2021]
    B_2022_2026: [2022, 2026]
final_params: expanding_all

candidates:
  v10_carry_vix:
    family: carry_riskfilter
    grid: {calm: [below_median, below_p80]}

risk_overrides:
  max_open_positions: 6
  max_currency_exposure: 2.0
  vol_target_annual: 0.03
  fixed_notional_leverage: 1.0

reference_v1: []

gates:                      # V5/V7/V9（10 ペア）と同一
  wf_min_trades: 100
  wf_min_profit_factor: 1.10
  wf_min_sharpe: 0.40
  wf_min_positive_year_ratio: 0.60
  wf_max_single_year_share: 0.40
  wf_max_drawdown: 0.25
  both_subperiods_positive: true
  stress_min_profit_factor: 1.00
  min_positive_pairs: 7
  max_regime_profit_share: 0.70
  deflated_sharpe_min: 0.50
  ml_must_beat_best_simple: true
  min_pnl_ex_top5: 0.0
  max_top1_share: 0.30
