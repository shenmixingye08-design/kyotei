# 研究プログラム（2026-09-26 登録）。本人の依頼:「合格するまでやって」。
# 「合格するまで試し続ける」は、そのままだと偶然の当たりを合格にしてしまう（多重検定）。そこで以下を先に決めておく。
registered_at: "2026-09-26"
versions: [v8, v9, v10, v11, v12]     # 最大 5 バージョンまで。これで合格が出なければ「個人口座の G10 FX に頑健な優位性は見つからない」と結論する
rules:
  - 各バージョンは評価前に research_plan_vN.yaml をコミットする（事前登録）。結果を見て同じバージョンを変えない
  - ゲートは V3〜V7 と同一。緩めない（ペア数に比例する「プラスのペア数」以外は変えない）
  - DSR は V1 からの累積試行数で補正する（dsr_trials: cumulative）。試すほど合格が難しくなる
  - 指標だけを良く見せる変更はしない（例: 1 つの長い建玉を時間で分割して「最大トレード比率」を下げる、など）
  - 各バージョンのアイデアは、公表された研究か経済的な理由があるものに限る。過去の結果から逆算した条件は使わない
after_pass:
  - 合格 = CHALLENGER 登録のみ。LOCK 後の PAPER Forward を最低 3 か月 かつ 30 トレード以上 観測する
  - PAPER Forward でもバックテストと整合したら報告する。LIVE は本人の明示的な「LIVE開始してよい」まで絶対に行わない
if_none_pass:
  - Champion は CASH のまま。FX の自動売買は研究のみとし、資金は IBKR の長期投資（本来の目的）を優先するよう提案する

# ---------------------------------------------------------------- フェーズ 2（2026-09-26 追加）
# 本人の依頼:「まだ研究して」（フェーズ 1 = V8〜V12 は全部不合格で終了）。同じルールで最大 5 バージョン追加する。
phase2:
  registered_at: "2026-09-26"
  versions: [v13, v14, v15, v16, v17]
  rules: 上の rules と同じ（ゲートを緩めない・累積 DSR・指標だけを良く見せる変更をしない・論文か経済的理由のあるアイデアだけ）
  themes: >
    フェーズ 1 までは価格・金利水準・リスク指標を使った。フェーズ 2 はまだ使っていない情報源を順に試す:
    金利の「変化」（金融政策の方向）、長短金利差（イールドカーブ）、それらの組み合わせ、
    戦略どうしの分散（別々の収益源をポートフォリオとして持つ）。
