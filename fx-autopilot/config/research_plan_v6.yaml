# 事前登録: V6（データ品質の改善による感度分析）。評価前にコミット。結果を見て変更しない（変更は v7）
plan_version: fx_plan_v6
registered_at: "2026-09-26"
purpose: >
  本人の依頼（2026-09-26）: データの質を上げる。
  これまでスワップ（コスト）とキャリー（シグナル）は、設計者の記憶に基づく政策金利の近似表（fxap/swap.py）で計算していた。
  V6 では同じ規則・同じパラメータのまま、金利を FRED の OECD 3 か月物短期金利（月次の実データ、公表遅れ 1 か月 +
  シグナルはさらに 1 か月ラグ）に置き換え、成績がどれだけ変わるかを見る。同時に Dukascopy 価格を米連銀 H.10 正午レートと突き合わせる。
contamination: >
  規則・パラメータ・期間はすべて既出（v2_trend_carry / v3_carry_trend_7p / v4_carry_trend_daily と同一）。
  新しいのは金利データだけ。したがって V6 は「新しい優位性の探索」ではなく「既存結果の頑健性チェック」。最終判断は LOCK 後の PAPER Forward。
swap_source: market

unit: portfolio
pairs: [USDJPY, EURUSD, EURJPY, GBPUSD, AUDUSD, AUDJPY, GBPJPY]
cost_profile: retail_jp
stress_profile: stress_2x
walk_forward:
  scheme: expanding
  first_test_year: 2014
  last_test_year: 2026
  min_train_trades: 20
  selection_metric: sharpe
  subperiods:
    A_2014_2021: [2014, 2021]
    B_2022_2026: [2022, 2026]
final_params: expanding_all

candidates:
  v6_trend_carry_mkt_5p:          # 比較対象: v2_trend_carry（政策金利近似表）
    family: trend_carry
    pairs: [USDJPY, EURUSD, EURJPY, GBPUSD, AUDUSD]
    grid: {mode: [composite], sizing: [risk_stop]}
  v6_carry_trend_mkt_7p:          # 比較対象: v3_carry_trend_7p
    family: trend_carry
    grid: {sizing: [risk_stop]}
  v6_carry_trend_daily_mkt_7p:    # 比較対象: v4_carry_trend_daily
    family: trend_carry
    grid: {threshold: [0.5]}

risk_overrides:
  max_open_positions: 4
  max_currency_exposure: 2.0
  vol_target_annual: 0.05
  fixed_notional_leverage: 1.0

reference_v1: []

gates:                             # V3/V4 と同じ（5 ペア候補も同じ基準で判定: プラスのペア数は 5）
  wf_min_trades: 100
  wf_min_profit_factor: 1.10
  wf_min_sharpe: 0.40
  wf_min_positive_year_ratio: 0.60
  wf_max_single_year_share: 0.40
  wf_max_drawdown: 0.25
  both_subperiods_positive: true
  stress_min_profit_factor: 1.00
  min_positive_pairs: 5
  max_regime_profit_share: 0.70
  deflated_sharpe_min: 0.50
  ml_must_beat_best_simple: true
  min_pnl_ex_top5: 0.0
  max_top1_share: 0.30
