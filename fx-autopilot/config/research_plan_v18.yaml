# 事前登録: V18（執行タイミングの修正による再評価）。評価前にコミット。結果を見て変更しない
plan_version: fx_plan_v18
registered_at: "2026-10-10"
purpose: >
  PAPER Forward（2026-09-29〜10-09）で、日足・週足の判断足（20:00 UTC 足）が米国夏時間中はロールオーバー直前に当たり、
  スプレッド・ゲート（中央値の 3 倍超で新規禁止）で新規が 42 回すべて拒否されていたことが判明。バックテストも同じ規則のため、
  過去検証でも夏時間中の新規が落ちていた。V18 は規則・パラメータを V6（市場金利の trend×carry、7 ペア）と同一にしたまま、
  判断後 4 本の H1 足まで同じ新規シグナルを出し続ける（スプレッドが戻った足で約定）ことだけを変える。
contamination: >
  これはバグ（執行タイミングの不備）の修正による再評価で、新しい優位性の探索ではない。対象は V3/V4/V6 で最も合格に近かった
  trend×carry であり、結果を知った上で選んでいる。ゲートは同一、保持本数 4 は登録時に固定（グリッドなし）。
  DSR は V1 からの累積試行数で補正。最終判断は LOCK 後の PAPER Forward。
swap_source: market
dsr_trials: cumulative

unit: portfolio
pairs: [USDJPY, EURUSD, EURJPY, GBPUSD, AUDUSD, AUDJPY, GBPJPY]
cost_profile: retail_jp
stress_profile: stress_2x
walk_forward:
  scheme: expanding
  first_test_year: 2014
  last_test_year: 2026
  min_train_trades: 20
  selection_metric: sharpe
  subperiods:
    A_2014_2021: [2014, 2021]
    B_2022_2026: [2022, 2026]
final_params: expanding_all

candidates:
  v18_carry_trend_daily_hold:      # 修正前: v6_carry_trend_daily_mkt_7p
    family: trend_carry
    grid: {threshold: [0.5]}
  v18_carry_trend_weekly_hold:     # 修正前: v6_carry_trend_mkt_7p
    family: trend_carry
    grid: {sizing: [risk_stop]}

risk_overrides:
  max_open_positions: 4
  max_currency_exposure: 2.0
  vol_target_annual: 0.05
  fixed_notional_leverage: 1.0

reference_v1: []

gates:                             # V3/V4 と同じ（5 ペア候補も同じ基準で判定: プラスのペア数は 5）
  wf_min_trades: 100
  wf_min_profit_factor: 1.10
  wf_min_sharpe: 0.40
  wf_min_positive_year_ratio: 0.60
  wf_max_single_year_share: 0.40
  wf_max_drawdown: 0.25
  both_subperiods_positive: true
  stress_min_profit_factor: 1.00
  min_positive_pairs: 5
  max_regime_profit_share: 0.70
  deflated_sharpe_min: 0.50
  ml_must_beat_best_simple: true
  min_pnl_ex_top5: 0.0
  max_top1_share: 0.30
