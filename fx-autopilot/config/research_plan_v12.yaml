# 事前登録: V12（キャリー・ポートフォリオのトレンド・タイミング）。評価前にコミット。研究プログラムの 5 本目（最後）
plan_version: fx_plan_v12
registered_at: "2026-09-26"
purpose: >
  Bertolini (2010, City University London)「Trading Foreign Exchange Carry Portfolios」ほか: キャリー・ポートフォリオは
  崩れ始めると下落が続く傾向があり、ポートフォリオ自身の過去リターンがマイナスの間は休むと損失を避けやすい。
  V7 のキャリーのみ（8 通貨の市場金利の横断ランキング → 10 ペア、月次、逆ボラ）に、
  「キャリー・ポートフォリオの過去 63 / 126 営業日の累積リターン（直物部分）> 0 のときだけ保有」というフィルターを加える。
contamination: >
  期間・コスト・ゲートは既出。V7 のキャリーのみ（フィルターなし）は -2.3% で不合格、前半（2014〜2021）がマイナスだった。
  フィルターは論文由来、期間は 3 か月 / 6 か月の 2 通りのみ。V7 の結果を見た後の登録であることを申告する。
  DSR は V1 からの累積試行数で補正。最終判断は LOCK 後の PAPER Forward。
swap_source: market
dsr_trials: cumulative

unit: portfolio
pairs: [USDJPY, EURUSD, EURJPY, GBPUSD, AUDUSD, AUDJPY, GBPJPY, NZDUSD, USDCAD, USDCHF]
cost_profile: retail_jp
stress_profile: stress_2x
walk_forward:
  scheme: expanding
  first_test_year: 2014
  last_test_year: 2026
  min_train_trades: 20
  selection_metric: sharpe
  subperiods:
    A_2014_2021: [2014, 2021]
    B_2022_2026: [2022, 2026]
final_params: expanding_all

candidates:
  v12_carry_timed:
    family: carry_timing
    grid: {lookback: [63, 126]}

risk_overrides:              # V7 と同一
  max_open_positions: 6
  max_currency_exposure: 2.0
  vol_target_annual: 0.03
  fixed_notional_leverage: 1.0

reference_v1: []

gates:                       # V5/V7/V9〜V11 と同一。緩めない
  wf_min_trades: 100
  wf_min_profit_factor: 1.10
  wf_min_sharpe: 0.40
  wf_min_positive_year_ratio: 0.60
  wf_max_single_year_share: 0.40
  wf_max_drawdown: 0.25
  both_subperiods_positive: true
  stress_min_profit_factor: 1.00
  min_positive_pairs: 7
  max_regime_profit_share: 0.70
  deflated_sharpe_min: 0.50
  ml_must_beat_best_simple: true
  min_pnl_ex_top5: 0.0
  max_top1_share: 0.30
