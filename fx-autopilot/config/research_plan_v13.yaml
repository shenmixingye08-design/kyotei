# 事前登録: V13（金利モメンタム = 金融政策の方向）。評価前にコミット。研究プログラム フェーズ 2 の 1 本目
plan_version: fx_plan_v13
registered_at: "2026-09-26"
purpose: >
  金利の「水準」（キャリー）ではなく「変化」: 過去 6 か月で短期金利が上がった通貨（利上げ局面）は買われ、
  下がった通貨（利下げ局面）は売られやすい。為替は金融政策の相対的な方向に反応するという標準的な考え方
  （金利平価と金融政策サプライズの研究、例: Engel 2016「Exchange Rates, Interest Rates, and the Risk Premium」）。
  8 通貨の市場金利（FRED 3 か月物）の 6 か月変化を横断ランキングし、V7 と同じ枠組み（10 ペア・月次・逆ボラ）で保有。
  比較: キャリー（水準）と組み合わせた版。
contamination: >
  期間・コスト・ゲートは既出。設計者は V1〜V12 の結果（キャリー系が 2022〜24 の円安に依存）を知っている。
  2022〜24 は米国の利上げ・日本の据え置きで、金利モメンタムもドル買い・円売りになるため同じ相場への依存が出る可能性がある。
  パラメータは閾値 2 通りのみ（6 か月は登録時に固定）。DSR は V1 からの累積試行数で補正。最終判断は LOCK 後の PAPER Forward。
swap_source: market
dsr_trials: cumulative

unit: portfolio
pairs: [USDJPY, EURUSD, EURJPY, GBPUSD, AUDUSD, AUDJPY, GBPJPY, NZDUSD, USDCAD, USDCHF]
cost_profile: retail_jp
stress_profile: stress_2x
walk_forward:
  scheme: expanding
  first_test_year: 2014
  last_test_year: 2026
  min_train_trades: 20
  selection_metric: sharpe
  subperiods:
    A_2014_2021: [2014, 2021]
    B_2022_2026: [2022, 2026]
final_params: expanding_all

candidates:
  v13_ratemom:
    family: rate_momentum
    grid: {threshold: [0.5, 1.0]}
  v13_carry_ratemom:
    family: rate_momentum
    grid: {threshold: [0.5, 1.0]}

risk_overrides:              # V7 と同一
  max_open_positions: 6
  max_currency_exposure: 2.0
  vol_target_annual: 0.03
  fixed_notional_leverage: 1.0

reference_v1: []

gates:                       # V5/V7/V9〜V11 と同一。緩めない
  wf_min_trades: 100
  wf_min_profit_factor: 1.10
  wf_min_sharpe: 0.40
  wf_min_positive_year_ratio: 0.60
  wf_max_single_year_share: 0.40
  wf_max_drawdown: 0.25
  both_subperiods_positive: true
  stress_min_profit_factor: 1.00
  min_positive_pairs: 7
  max_regime_profit_share: 0.70
  deflated_sharpe_min: 0.50
  ml_must_beat_best_simple: true
  min_pnl_ex_top5: 0.0
  max_top1_share: 0.30
